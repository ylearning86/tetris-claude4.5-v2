<!DOCTYPE html>
<html lang="ja" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="テトリス">
    <title>テトリス</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 data-i18n="title">テトリス</h1>
            <button id="language-toggle" class="language-button">English</button>
        </div>
        
        <div class="score-container">
            <div class="score-item">
                <span data-i18n="score">スコア</span>
                <span id="score">0</span>
            </div>
            <div class="score-item">
                <span data-i18n="level">レベル</span>
                <span id="level">1</span>
            </div>
            <div class="score-item">
                <span data-i18n="lines">ライン</span>
                <span id="lines">0</span>
            </div>
        </div>
        
        <div class="game-content">
            <div class="game-board-container">
                <canvas id="game-board" width="300" height="600"></canvas>
                <div id="game-over" class="game-over hidden">
                    <h2 data-i18n="gameOver">ゲームオーバー</h2>
                    <p><span data-i18n="finalScore">最終スコア</span>: <span id="final-score">0</span></p>
                    <button id="restart-button" data-i18n="playAgain">もう一度プレイ</button>
                </div>
            </div>
            
            <div class="side-panel">
                <div class="next-piece">
                    <h3 data-i18n="nextPiece">次のブロック</h3>
                    <canvas id="next-piece" width="120" height="120"></canvas>
                </div>
                
                <div class="controls-info">
                    <h3 data-i18n="controls">操作方法</h3>
                    <ul>
                        <li><strong>←/→</strong>: <span data-i18n="controlMove">左右移動</span></li>
                        <li><strong>↓</strong>: <span data-i18n="controlDrop">高速落下</span></li>
                        <li><strong>↑/スペース</strong>: <span data-i18n="controlRotate">回転</span></li>
                        <li><strong>P</strong>: <span data-i18n="controlPause">一時停止</span></li>
                    </ul>
                </div>
                
                <button id="start-button" class="control-button" data-i18n="start">スタート</button>
                <button id="pause-button" class="control-button" data-i18n="pause" disabled>一時停止</button>
            </div>
        </div>
        
        <!-- タッチコントロール（iPad/モバイル用） -->
        <div class="touch-controls hidden" id="touch-controls">
            <div class="touch-controls-header">
                <h3 data-i18n="nextPiece">次のブロック</h3>
                <canvas id="next-piece-touch" width="120" height="120"></canvas>
            </div>
            <div class="touch-controls-buttons">
                <button id="start-button-touch" class="control-button" data-i18n="start">スタート</button>
                <button id="pause-button-touch" class="control-button" data-i18n="pause" disabled>一時停止</button>
            </div>
            <div class="touch-row">
                <button class="touch-button" id="rotate-button">↻<br/><span data-i18n="rotate">回転</span></button>
            </div>
            <div class="touch-row">
                <button class="touch-button" id="left-button">←</button>
                <button class="touch-button" id="down-button">↓<br/><span data-i18n="drop">落下</span></button>
                <button class="touch-button" id="right-button">→</button>
            </div>
        </div>
    </div>
    
    <script src="https://ylearning86.github.io/game-portal/game-integration.js?v=1766304844"></script>
    <script src="script.js"></script>
</body>
</html>
